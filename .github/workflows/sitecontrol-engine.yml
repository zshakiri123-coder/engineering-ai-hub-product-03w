name: Site Control Engine Regression

on:
  push:
    branches:
      - main
      - qa/site-control-automated-regression
  pull_request:

jobs:
  site-control-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real embedded SiteEngine
        run: node --test tests/sitecontrol-engine.test.cjs
