name: Product 03W - Engine regression
on:
  push:
    paths:
      - 'index.html'
      - 'qa/site-control-engine.test.cjs'
      - '.github/workflows/site-control-qa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'qa/site-control-engine.test.cjs'
      - '.github/workflows/site-control-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic engineering and site-control release checks
        run: node --test qa/site-control-engine.test.cjs
